<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        background: #5a3e2b;
        color: white;
        font-size: 20px;
        padding: 10px 15px;
        border-radius: 50%;
        text-decoration: none;
        z-index: 1000;
      }

      .back-btn:hover {
        transform: scale(1.1);
      }
      .booking {
        height: 100vh;
        width: 100%;
        background: url("/assests/ccccccc") center/cover no-repeat fixed;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .booking-box {
        width: 350px;
        padding: 40px;
        border-radius: 15px;

        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);

        text-align: center;
        color: white;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .booking-box h2 {
        margin-bottom: 10px;
      }

      .booking-box p {
        font-size: 14px;
        margin-bottom: 20px;
      }

      .booking-box form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .booking-box input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
      }

      .booking-box button {
        padding: 12px;
        border-radius: 25px;
        border: none;

        background: #8b5e3c;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      .booking-box button:hover {
        background: #5a3b25;
      }

      .booking-box input:focus {
        box-shadow: 0 0 5px #8b5e3c;
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-btn">←</a>
    <section class="booking">
      <div class="booking-box">
        <h2>Book Your Table</h2>
        <p>Reserve your spot at Aroma Haven ☕</p>

        <form>
          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email Address" required />
          <input type="tel" placeholder="Phone Number" required />
          <input type="date" required />
          <input type="time" required />
          <input type="number" placeholder="Guests" required />

          <button type="submit">Book Now</button>
        </form>
      </div>
    </section>
  </body>
</html>
