<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aroma Haven</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background-image: url(/assets/bg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #5a3e2b;
  color: white;
  font-size: 20px;
  padding: 10px 15px;
  border-radius: 50%;
  text-decoration: none;
  z-index: 1000;
}

.back-btn:hover {
  transform: scale(1.1);
}

.login-box {
    background: rgba(255, 255, 255, 0.15); /* glass effect */
    backdrop-filter: blur(12px);
    padding: 35px 30px;
    width: 320px;
    border-radius: 15px;
    text-align: center;

    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
}

.login-box h2 {
    margin-bottom: 25px;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 12px 0;

    border: none;
    outline: none;
    border-radius: 25px;

    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 14px;
}

.login-box input::placeholder {
    color: #ddd;
}

.login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;

    border: none;
    border-radius: 25px;

    background: linear-gradient(45deg, #8b5e3c, #a9745b);
    color: white;
    font-weight: bold;

    cursor: pointer;
    transition: 0.3s;
}

.login-box button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(139,94,60,0.8);
}
</style>
</head>

<body>
<a href="index.html" class="back-btn">←</a>
<div class="login-box">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
</div>

</body>
</html>
