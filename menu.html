<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Menu</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5ede3;
      margin: 0;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: #4b2e1e;
      color: white;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .navbar h2 {
      margin: 0;
      font-family: 'Playfair Display', serif;
    }

    .navbar a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .back-btn {
      position: fixed;
      top: 80px;
      left: 20px;
      background: #5a3e2b;
      color: white;
      font-size: 20px;
      padding: 10px 15px;
      border-radius: 50%;
      text-decoration: none;
      z-index: 1000;
    }

    .back-btn:hover {
      transform: scale(1.1);
    }

    .title {
      text-align: center;
      margin: 40px 0;
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      color: #4b2e1e;
    }

    .coffee-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 30px;
      padding: 20px;
    }

    .coffee-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .coffee-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .coffee-card:hover img {
      transform: scale(1.12);
    }

    .coffee-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .coffee-card h3 {
      padding: 15px;
      font-size: 18px;
      color: #3a2a1f;
    }

  </style>
</head>

<body>

<nav class="navbar">
  <h2>Aroma Heaven</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="contact.html">Contact</a>
    <a href="feedback.html">Feedback</a>
  </div>
</nav>

<a href="index.html" class="back-btn">←</a>

<h1 class="title">Our Coffee Collection</h1>

<div class="coffee-container">

  <div class="coffee-card"><img src="/assets/espresso.jpg"><h3>Espresso</h3></div>
  <div class="coffee-card"><img src="/assets/capucino.jpg"><h3>Cappuccino</h3></div>
  <div class="coffee-card"><img src="/assets/latte3.jpg"><h3>Latte</h3></div>
  <div class="coffee-card"><img src="/assets/mocha.jpg"><h3>Mocha</h3></div>

  <div class="coffee-card"><img src="/assets/americano.jpg"><h3>Americano</h3></div>
  <div class="coffee-card"><img src="/assets/flat.jpg"><h3>Flat White</h3></div>
  <div class="coffee-card"><img src="/assets/macchiato.jpg"><h3>Macchiato</h3></div>
  <div class="coffee-card"><img src="/assets/iced 1.jpg"><h3>Iced Coffee</h3></div>

  <div class="coffee-card"><img src="/assets/cold.jpg"><h3>Cold Brew</h3></div>
  <div class="coffee-card"><img src="/assets/affagato.jpg"><h3>Affogato</h3></div>
  <div class="coffee-card"><img src="/assets/irish.jpg"><h3>Irish Coffee</h3></div>
  <div class="coffee-card"><img src="/assets/turkish.jpg"><h3>Turkish Coffee</h3></div>

</div>

</body>
</html>
